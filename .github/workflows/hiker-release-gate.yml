name: Hiker Release Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    name: Hiker release gate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify source, tests, performance, and package provenance
        shell: pwsh
        run: >-
          python
          skill-groups/ai-software-engineering-platform-enterprise/tools/self_governance.py
          --root "$env:GITHUB_WORKSPACE"
          --archive-dir
          "$env:GITHUB_WORKSPACE/skill-groups/ai-software-engineering-platform-enterprise/dist"

      - name: Verify isolated clean installation
        shell: pwsh
        run: >-
          python
          skill-groups/ai-software-engineering-platform-enterprise/tools/verify_clean_install.py
          --suite
          "$env:GITHUB_WORKSPACE/skill-groups/ai-software-engineering-platform-enterprise"
          --archive-dir
          "$env:GITHUB_WORKSPACE/skill-groups/ai-software-engineering-platform-enterprise/dist"
