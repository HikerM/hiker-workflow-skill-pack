<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>运行状态检查</title>
  <style>
    :root { --canvas: #f4f7fb; --surface: #fff; --ink: #172033; --muted: #5e6b82; --accent: #155eef; --border: #d8e0ee; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 6px 0 8px; font-size: clamp(1.7rem, 5vw, 2.5rem); }
    .summary { margin: 0 0 24px; color: var(--muted); }
    .status-panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 24px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
    .status-panel strong { display: block; margin-bottom: 4px; }
    button { min-height: 44px; border: 0; border-radius: 10px; padding: 10px 18px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; }
    #details { grid-column: 1 / -1; margin: 0; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { main { margin: 24px auto; } .status-panel { grid-template-columns: 1fr; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">系统运行状态</div>
    <h1>服务运行正常</h1>
    <p class="summary">最近一次检查已完成，可以继续处理当前业务。</p>
    <section class="status-panel" data-component-id="bs:status-panel" aria-labelledby="status-heading">
      <div>
        <strong id="status-heading">核心服务可用</strong>
        <span>所有必要依赖均已响应。</span>
      </div>
      <button id="inspect" type="button" aria-expanded="false" aria-controls="details">查看检查详情</button>
      <p id="details" hidden>检查包括连接、权限和数据一致性，未发现需要用户处理的问题。</p>
    </section>
  </main>
  <script>
    const button = document.querySelector('#inspect');
    const details = document.querySelector('#details');
    button.addEventListener('click', () => {
      const expanded = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', String(!expanded));
      button.textContent = expanded ? '查看检查详情' : '收起检查详情';
      details.hidden = expanded;
    });
  </script>
</body>
</html>
